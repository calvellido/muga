# Tags each new version merged into main as v<version>, and publishes its GitHub Release with
# the version's CHANGELOG.md section (ADR 0015). A version that's already released is skipped.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commits; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
            exit 0
          fi
          pnpm --silent version:notes > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "Muga $version" --notes-file notes.md
